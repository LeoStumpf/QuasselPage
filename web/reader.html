<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader – QuasselPage</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="reader" id="reader">
  <header class="topbar">
    <a class="btn" href="/" title="Zur Bibliothek">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Bibliothek
    </a>
    <div class="ttlbox">
      <div class="title" id="title">…</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg opt" id="viewmode" role="group" aria-label="Ansicht" hidden>
      <span>Ansicht</span>
      <button data-v="original" aria-pressed="true" title="Webseite so, wie sie im Original aussieht">Original</button>
      <button data-v="reader" aria-pressed="false" title="Nur der Text, gut lesbar formatiert">Lesefassung</button>
    </div>
    <div class="seg outline opt" id="zoomgrp" role="group" aria-label="Zoom">
      <button class="zbtn" id="zout" title="Verkleinern (−)" aria-label="Verkleinern">−</button>
      <span class="val" id="zval">100 %</span>
      <button class="zbtn" id="zin" title="Vergrößern (+)" aria-label="Vergrößern">+</button>
      <button id="fitw" title="Seite auf volle Breite" aria-pressed="false">Breite</button>
      <button id="fitp" title="Ganze Seite einpassen" aria-pressed="false">Ganze Seite</button>
    </div>
    <label class="chk opt" title="Beim Vorlesen automatisch mitscrollen"><input type="checkbox" id="autoscroll">mitscrollen</label>
    <button class="btn ghost icon opt" id="pdfdark" title="PDF dunkel darstellen" aria-label="PDF dunkel darstellen">◐</button>
    <div class="seg playerpos" role="group" aria-label="Position des Players">
      <span>Player</span>
      <button data-pos="right" aria-pressed="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>rechts</button>
      <button data-pos="bottom" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15h18"/></svg>unten</button>
    </div>
    <button class="btn icon" id="sidetoggle" aria-label="Einstellungen und Inhalt" aria-expanded="false" aria-controls="side">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div class="rbody">
    <nav class="thumbs" id="thumbs" aria-label="Seiten" hidden></nav>
    <div class="viewwrap">
      <div class="view" id="view"></div>
      <span class="pagechip" id="pagechip" hidden></span>
      <button class="btn primary follow" id="follow">↓ Zur aktuellen Stelle</button>
    </div>
    <aside class="rside" id="side">
      <div id="slot"></div>
      <section aria-label="Tempo und Stimme">
        <h3>Tempo</h3>
        <div class="rates" id="rates"></div>
        <label class="voicerow">Stimme <select id="voice"></select></label>
      </section>
      <section id="tocsec" hidden>
        <h3>Inhalt</h3>
        <div class="toc" id="toc"></div>
      </section>
      <p class="hint">In einen Satz klicken → ab dort vorlesen. Kopf- und Fußzeilen sowie Seitenzahlen werden übersprungen.<br>
        Tasten: Leertaste Start/Pause · ←/→ Satz · +/− Zoom</p>
    </aside>
  </div>
  <footer class="dock" id="dock"></footer>

  <section class="pl" id="pl" aria-label="Player">
    <div class="now">
      <span class="chap" id="nowchap">Jetzt</span>
      <span class="quote" id="nowtext"></span>
    </div>
    <div class="ctrls">
      <button class="cb" id="back15" title="15 s zurück" aria-label="15 Sekunden zurück">−15</button>
      <button class="cb" id="prev" title="Vorheriger Satz (←)" aria-label="Vorheriger Satz"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="cb play" id="play" title="Abspielen/Pause (Leertaste)" aria-label="Abspielen"></button>
      <button class="cb" id="next" title="Nächster Satz (→)" aria-label="Nächster Satz"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="cb" id="fwd15" title="15 s vor" aria-label="15 Sekunden vor">+15</button>
    </div>
    <div class="progress">
      <div class="pbar" id="pbar" title="Klicken, um zu springen"><i class="r" id="pr"></i><i class="h" id="ph"></i></div>
      <div class="pinfo"><span id="state"></span><span id="remain"></span></div>
      <div class="legend"><span><i style="background:#E8B04B"></i>gehört</span><span><i style="background:#5FA88F"></i>vorgerendert</span></div>
    </div>
  </section>
</div>
<script type="module" src="/static/reader.js"></script>
</body>
</html>
