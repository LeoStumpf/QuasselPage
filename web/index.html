<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuasselPage</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="lib">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h1>QuasselPage</h1>
    <button id="quit" title="Server beenden (gibt den Arbeitsspeicher frei)">Beenden</button>
  </div>
  <p class="sub">PDFs und Webseiten lokal vorlesen lassen – alles bleibt auf diesem Rechner.</p>

  <section class="import">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
      <strong>PDF hierher ziehen</strong> oder klicken zum Auswählen
    </label>
    <form class="row" id="urlform">
      <input type="url" id="url" placeholder="Webseiten-Adresse (https://…)" required>
      <button class="primary" type="submit">Laden</button>
    </form>
    <details>
      <summary>Text einfügen</summary>
      <input type="text" id="ttitle" placeholder="Titel (optional)" style="width:100%;margin-top:8px">
      <textarea id="text" placeholder="Text hier einfügen …"></textarea>
      <button id="textbtn" class="primary">Übernehmen</button>
    </details>
    <div class="msg" id="msg"></div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="font-size:17px;margin:0">Bibliothek</h2>
      <label class="muted" style="font-size:13px"><input type="checkbox" id="bg"> im Hintergrund vorrendern</label>
    </div>
    <div class="docs" id="docs"></div>
  </section>
</main>
<script type="module" src="/static/library.js"></script>
</body>
</html>
