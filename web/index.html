<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuasselPage</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="lib">
  <nav class="side" aria-label="Bibliothek">
    <a class="brand" href="/"><img src="/static/icon.svg" alt=""><strong>QuasselPage</strong></a>
    <label class="btn primary" for="file">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      PDF hinzufügen
    </label>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true"><span class="dot" style="background:#0E6B55"></span>Alle Dokumente<span class="cnt" data-c="all">0</span></button>
      <button data-f="cont" aria-pressed="false"><span class="dot" style="background:#E07A4F"></span>Weiterhören<span class="cnt" data-c="cont">0</span></button>
      <button data-f="pdf" aria-pressed="false"><span class="dot" style="background:#E0447A"></span>PDFs<span class="cnt" data-c="pdf">0</span></button>
      <button data-f="web" aria-pressed="false"><span class="dot" style="background:#2FB36B"></span>Webseiten &amp; Texte<span class="cnt" data-c="web">0</span></button>
    </div>
    <div class="ttsbox">
      <div class="lbl">Sprachausgabe</div>
      <div class="st"><span class="led" id="led"></span><span id="tts">…</span></div>
      <div class="meter" title="Anteil des bereits erzeugten Audios aller Dokumente"><i id="ttsbar"></i></div>
      <label class="chk"><input type="checkbox" id="bg">im Hintergrund vorrendern</label>
      <button class="btn outline" id="quit" title="Server beenden (gibt den Arbeitsspeicher frei)">Beenden</button>
    </div>
  </nav>

  <main class="libmain" id="drop">
    <div class="addbar">
      <form class="urlbox" id="urlform">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E6B55" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        <input type="url" id="url" placeholder="Webseiten-Adresse einfügen …" aria-label="Webseiten-Adresse" required>
        <button class="btn terra" type="submit">Laden</button>
      </form>
      <label class="btn dashed" for="file">PDF ablegen</label>
      <button class="btn outline" id="texttoggle" aria-expanded="false" aria-controls="textbox">Text einfügen</button>
    </div>
    <div class="textbox" id="textbox" hidden>
      <input type="text" id="ttitle" placeholder="Titel (optional)" aria-label="Titel">
      <textarea id="text" placeholder="Text hier einfügen …" aria-label="Text"></textarea>
      <div class="row">
        <button class="btn ghost" id="textcancel" type="button">Abbrechen</button>
        <button class="btn primary" id="textbtn" type="button">Übernehmen</button>
      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <section id="contsec" hidden>
      <h2 style="margin-bottom:14px">Weiterhören</h2>
      <div id="hero"></div>
    </section>

    <section>
      <h2 style="margin-bottom:14px">Bibliothek</h2>
      <div class="grid" id="docs"></div>
    </section>
  </main>
</div>
<script type="module" src="/static/library.js"></script>
</body>
</html>
